name: Verify Jekyll site

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
      - name: Check generated pages and assets
        run: |
          test -s _site/index.html
          test -s _site/aboutme.html
          test -s _site/feed.xml
          test -s _site/sitemap.xml
          test -s _site/assets/css/style.css
          test -s _site/assets/img/favicon.svg
